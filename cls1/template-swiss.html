<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>77 Example Road | Swiss Contemporary Modernist Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="theme-swiss">

  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">
        <span class="property-tag" style="color: #e11d48;">SWISS MODERNIST</span>
        <span class="logo-text">77 EXAMPLE ROAD</span>
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">← BACK TO SWITCHER</a></li>
        </ul>
      </nav>
      <button class="btn-primary open-showing-modal">REQUEST SHOWING</button>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      
      <!-- Giant Title Header -->
      <div class="swiss-header-hero">
        <span style="font-weight: 800; color: #e11d48; text-transform: uppercase;">CONTEMPORARY RESIDENCE SHOWCASE</span>
        <h1 class="swiss-giant-title">77 EXAMPLE ROAD</h1>
      </div>

      <!-- 50/50 Asymmetrical Split Hero -->
      <div class="swiss-asymmetric-grid">
        <div class="swiss-hero-left"></div>
        <div class="swiss-hero-right">
          <div>
            <div style="font-size: 0.9rem; font-weight: 800; color: #71717a; text-transform: uppercase;">OFFERED AT</div>
            <div class="swiss-metric-big">$849,900</div>
          </div>
          <div style="margin-top: 24px; font-weight: 700;">
            CHESTER, NEW HAMPSHIRE &bull; 4 BEDS &bull; 3.5 BATHS &bull; 3,850 SQFT
          </div>
        </div>
      </div>

    </div>

  <script type="module" src="js/app.js"></script>
