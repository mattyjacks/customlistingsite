<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>77 Example Road | Midnight Dark Luxury Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="theme-midnight">

  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">
        <span class="property-tag" style="color: #38bdf8;">MIDNIGHT SANCTUARY</span>
        <span class="logo-text" style="color: #fff;">77 Example Road</span>
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" style="color: #38bdf8;">← Back to Switcher</a></li>
          <li><a href="#overview" class="nav-link">Overview</a></li>
        </ul>
      </nav>
      <button class="btn-primary open-showing-modal">Request Showing</button>
    </div>
  </header>

  <main class="container" style="padding-top: 32px;">
    <div class="hero-banner">
      <div class="hero-overlay">
        <h1 style="color: #fff;">77 Example Road</h1>
        <p style="color: #94a3b8; font-size: 1.1rem; margin-bottom: 8px;">Chester, New Hampshire &bull; Dark Obsidian Vibe</p>

    <section class="section-card" id="overview">
      <h2 class="card-title">Midnight Dark Luxury Vibe</h2>
      <p style="color: #cbd5e1; font-size: 1.1rem; line-height: 1.8;">

      </p>
    </section>

  <script type="module" src="js/app.js"></script>
