<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>77 Example Road | Midnight Dark Luxury Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="theme-midnight">

  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">
        <span class="property-tag" style="color: #38bdf8;">MIDNIGHT SANCTUARY</span>
        <span class="logo-text" style="color: #fff;">77 Example Road</span>
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" style="color: #38bdf8;">← Back to Switcher</a></li>
        </ul>
      </nav>
      <button class="btn-primary open-showing-modal">Request Showing</button>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      
      <!-- Sticky Glassmorphic Metric Ribbon -->
      <div class="midnight-metric-ribbon">
        <div class="midnight-metric-card">
          <div class="midnight-metric-val">$849,900</div>
          <div class="midnight-metric-lbl">Listing Price</div>
        </div>
        <div class="midnight-metric-card">
          <div class="midnight-metric-val">4 Beds</div>
          <div class="midnight-metric-lbl">Bedrooms</div>
        </div>
        <div class="midnight-metric-card">
          <div class="midnight-metric-val">3.5 Baths</div>
          <div class="midnight-metric-lbl">Bathrooms</div>
        </div>
        <div class="midnight-metric-card">
          <div class="midnight-metric-val">3,850</div>
          <div class="midnight-metric-lbl">Sq Footage</div>
        </div>
      </div>

      <!-- Dark Room Hotspots Stage -->
      <section class="section-card">
        <h2 class="card-title" style="color: #fff;">Interactive Dark Room Hotspots</h2>
        <div class="floorplan-container">
          <div class="floorplan-stage">
            <div class="floorplan-graphic fpGraphic"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
